<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>B-Movie Title Generator</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Creepster&family=Montserrat:wght@400;700&family=Bebas+Neue&display=swap"
			rel="stylesheet" />
		<link href="styles.css" rel="stylesheet" />
		<script src="script.js" type="module" defer></script>
	</head>
	<body>
		<main class="container">
			<div class="output-box">
				<div class="marquee-text">
					<p>
						<span id="now-playing">NOW PLAYING:</span><br />
						<span id="movie-title" class="result">Coming soon!</span>
					</p>
				</div>
				<button id="generate-btn" type="button" class="generate-btn">
					Update Marquee
				</button>
			</div>
		</main>
	</body>
</html>
